name: CI/CD

# PR na main  -> so roda os testes (gate de merge).
# Push na main -> testes, publica a imagem no GHCR e faz o deploy na VPS (SSH).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Dois deploys simultaneos disputariam o mesmo servico. Enfileira em vez de
# cancelar: cancelar no meio deixaria a VPS entre duas versoes.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Namespace do dono do repo: o GITHUB_TOKEN so publica pacotes dele.
  IMAGE: ghcr.io/unipromove/unimove-backend

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    # Postgres real para os *IT (contratos HTTP, jornada da corrida, trava da
    # V19). Sem ele os IT sao pulados e o merge passaria sem prova-los.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unitarios + *IT contra o Postgres do service acima.
      - name: mvn verify
        env:
          IT_DATABASE_URL: jdbc:postgresql://localhost:5432/postgres
        run: mvn -B verify -Dbuild.commit=${{ github.sha }}

      # Reaproveitado pelo job de build: evita recompilar.
      - name: Preparar app.jar
        if: github.event_name != 'pull_request'
        run: cp target/unimove-backend-*.jar app.jar

      - name: Publicar artefato
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: app.jar
          retention-days: 1

  build:
    name: Imagem -> GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # So o .dockerignore e o Dockerfile — o contexto de build e so o app.jar.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-jar

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Sem RUN no Dockerfile, a imagem arm64 sai sem emulacao: cobre VPS ARM (Hetzner CAX).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy na VPS
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Sem VPS_HOST, pular com aviso: e assim que o primeiro deploy espera o
      # restore dos dados (docs/deploy-vps.md). Subir a API antes deixaria o
      # Flyway criar o schema vazio e o restore colidiria com ele.
      - name: Verificar configuracao da VPS
        id: cfg
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::warning::VPS_HOST nao configurado — deploy pulado. A imagem foi publicada no GHCR (docs/deploy-vps.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # So os arquivos da stack vao para a VPS; nada de codigo-fonte.
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'

      # Chave dedicada ao CI e host fixado: sem o known_hosts, um
      # StrictHostKeyChecking=no aceitaria qualquer servidor no meio do caminho.
      - name: Configurar SSH
        if: steps.cfg.outputs.skip != 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Sincroniza compose/Caddyfile/scripts com o commit e roda o deploy.sh,
      # que sobe a tag do SHA, confere o health local e faz rollback sozinho.
      # Os segredos ficam no .env da VPS: o CI so conhece a chave de SSH.
      - name: Deploy
        if: steps.cfg.outputs.skip != 'true'
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          tar czf - docker-compose.prod.yml Caddyfile scripts | ssh "$TARGET" 'tar xzf - -C /opt/unimove'
          ssh "$TARGET" "bash /opt/unimove/scripts/deploy.sh ${{ github.sha }}"

      # O deploy.sh ja provou o health por dentro; aqui prova o caminho publico
      # (DNS do DuckDNS + certificado do Caddy). Variavel, nao secret: a URL e
      # publica e mascarada so atrapalharia o log.
      - name: Health publico
        if: steps.cfg.outputs.skip != 'true' && vars.VPS_PUBLIC_URL != ''
        run: |
          BASE=$(printf '%s' "${{ vars.VPS_PUBLIC_URL }}" | sed 's:/*$::')
          for i in $(seq 1 6); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 10 \
                     "$BASE/actuator/health" || echo 000)
            if [ "$CODE" = "200" ] && grep -q '"status":"UP"' /tmp/health.json; then
              echo "servico UP em $BASE"
              exit 0
            fi
            echo "tentativa $i: HTTP $CODE"
            sleep 10
          done
          echo "::error::$BASE nao respondeu UP (ultimo HTTP $CODE). 000 = DNS/firewall; erro de TLS = Caddy sem certificado (docker compose logs caddy)."
          exit 1
