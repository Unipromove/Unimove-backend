spring:
  application:
    name: unimove
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/unimove}
    username: ${DATABASE_USER:unimove}
    password: ${DATABASE_PASSWORD:changeme}
  jpa:
    hibernate:
      # Schema gerenciado por Flyway. Hibernate APENAS valida — nunca altera.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  servlet:
    multipart:
      # Documentos do motorista: teto de 5 MB conferido no service; aqui so a
      # folga do envelope multipart. Acima disso o Spring corta com 413.
      max-file-size: 6MB
      max-request-size: 7MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Publico, entao so o status. Liveness nao olha o banco (queda do banco
      # nao deve reiniciar o container); readiness e o /health geral olham.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    build:
      enabled: true

server:
  # PORT e injetado pela maioria dos PaaS e tem precedencia:
  # sem isso o container escuta numa porta que o balanceador nao consulta e o
  # servico nunca fica saudavel. SERVER_PORT continua valendo fora do PaaS.
  port: ${PORT:${SERVER_PORT:8080}}
  # O TLS termina no Caddy: sem honrar o X-Forwarded-Proto o Swagger anuncia
  # http:// e o navegador bloqueia a chamada (mixed content). O `native`
  # (RemoteIpValve) so confia em proxy de IP interno, e a 8080 da VPS so
  # escuta em 127.0.0.1.
  forward-headers-strategy: native
  tomcat:
    # Redirect relativo (Location: /docs/login). Absoluto, o Tomcat usaria o
    # esquema/porta internos (http:8080) que nao existem atras do Caddy.
    use-relative-redirects: true

app:
  payment:
    # Pix sem PSP e so simulado (nenhum dinheiro circula). Piloto e so dinheiro:
    # desligado, confirm-payment PIX responde 409. Ligar quando houver PSP real.
    pix-enabled: ${PAYMENT_PIX_ENABLED:false}
  flyway:
    # A V19 apaga usuarios e corridas. Em banco abaixo dela com dados reais o
    # boot para; so libere depois de backup testado (docs/homologacao-runbook.md).
    allow-destructive-v19: ${UNIMOVE_ALLOW_DESTRUCTIVE_V19:false}
  jwt:
    # Em prod, JWT_SECRET vem do ambiente. Default aqui so para nao quebrar startup em dev local.
    secret: ${JWT_SECRET:dev-secret-NAO-USE-EM-PRODUCAO-troque-via-env-var}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  auth:
    lockout:
      # Apos max-attempts falhas seguidas (por e-mail), bloqueia o login por lockout-minutes.
      enabled: ${LOGIN_LOCKOUT_ENABLED:true}
      max-attempts: ${LOGIN_LOCKOUT_MAX_ATTEMPTS:5}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
      cleanup-interval-ms: ${LOGIN_LOCKOUT_CLEANUP_INTERVAL_MS:600000}
  rate-limit:
    # Teto por janela fixa (em memoria). auth = login/cadastro/social por IP;
    # maps = geocode/reverse por usuario. 429 + Retry-After quando estoura.
    auth:
      max-requests: ${RATE_LIMIT_AUTH_MAX:30}
      window-minutes: ${RATE_LIMIT_AUTH_WINDOW_MINUTES:10}
    maps:
      max-requests: ${RATE_LIMIT_MAPS_MAX:60}
      window-minutes: ${RATE_LIMIT_MAPS_WINDOW_MINUTES:1}
  phone-verification:
    # LOG = dev/testes (link e codigo saem no log, webhook aceita POST manual).
    # WHATSAPP = producao; exige app.whatsapp.* preenchido ou o startup falha.
    channel: ${PHONE_VERIFICATION_CHANNEL:LOG}
    challenge-ttl-minutes: ${PHONE_CHALLENGE_TTL_MINUTES:10}
    token-ttl-minutes: ${PHONE_TOKEN_TTL_MINUTES:15}
    max-challenges-per-ip-hour: ${PHONE_MAX_CHALLENGES_PER_IP_HOUR:20}
    purge-interval-ms: ${PHONE_VERIFICATION_PURGE_INTERVAL_MS:600000}
  social:
    google:
      # Desligado por padrao: dev e testes rodam sem credencial e /auth/social responde 503.
      enabled: ${GOOGLE_LOGIN_ENABLED:false}
      # Lista separada por virgula. O 'aud' do id_token muda por plataforma:
      # Android com serverClientId devolve o client ID WEB, iOS devolve o client ID iOS.
      client-ids: ${GOOGLE_CLIENT_IDS:}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
  security:
    # 32 bytes em base64 (openssl rand -base64 32). Cifra CPF/CNH no banco.
    # Obrigatoria em prod (o boot falha sem ela); em dev cai numa chave fixa com aviso.
    data-encryption-key: ${DATA_ENCRYPTION_KEY:}
  retention:
    # Expurgo LGPD diario: corridas antigas perdem endereco/rota/posicao; arquivos de
    # documento reprovados ou substituidos saem do storage. Ver docs/lgpd-inventario-dados.md.
    enabled: ${RETENTION_ENABLED:true}
    ride-years: ${RETENTION_RIDE_YEARS:5}
    rejected-document-days: ${RETENTION_REJECTED_DOCUMENT_DAYS:90}
  privacy:
    # Versao vigente dos termos + politica (GET /legal/terms). Trocar exige novo aceite no cadastro.
    terms-version: ${PRIVACY_TERMS_VERSION:2026-10}
    policy-url: ${PRIVACY_POLICY_URL:https://unimove.app/privacidade}
  storage:
    documents:
      # Documentos do motorista (CNH/CRLV/selfie) em disco, cifrados com a
      # DATA_ENCRYPTION_KEY. Sem dir o upload responde 503 (dev/testes).
      dir: ${DOCUMENTS_DIR:}
      # Prefixo da URL assinada entregue ao admin (https://dominio). Vazio = relativa.
      public-base-url: ${DOCUMENTS_PUBLIC_BASE_URL:}
      signed-url-ttl-seconds: ${DOCUMENTS_SIGNED_URL_TTL_SECONDS:300}
  whatsapp:
    # Numero da UniMove em E.164 sem '+'. So usado com channel=WHATSAPP.
    business-number: ${WHATSAPP_BUSINESS_NUMBER:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
  driver:
    presence:
      # Motorista online sem nenhum request ha mais que offline-after-minutes e marcado offline pelo sistema.
      enabled: ${DRIVER_AUTO_OFFLINE_ENABLED:true}
      offline-after-minutes: ${DRIVER_AUTO_OFFLINE_MINUTES:10}
      scan-interval-ms: ${DRIVER_AUTO_OFFLINE_SCAN_INTERVAL_MS:60000}
  osrm:
    base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
  photon:
    base-url: ${PHOTON_BASE_URL:https://photon.komoot.io}
  ride:
    # Formula de tarifa — centralizada para ajuste facil.
    bandeira: 5.50
    preco-por-km: 2.10
    preco-por-min: 0.20
    location:
      # Sanidade da posicao do motorista no PUT /rides/{id}/driver-location (422 quando recusa).
      max-age-seconds: ${DRIVER_LOCATION_MAX_AGE_SECONDS:120}
      max-accuracy-m: ${DRIVER_LOCATION_MAX_ACCURACY_M:100}
      max-speed-kmh: ${DRIVER_LOCATION_MAX_SPEED_KMH:180}
    expiration:
      # Corrida parada no mural sem motorista por mais que ttl-minutes vira EXPIRED.
      enabled: ${RIDE_EXPIRATION_ENABLED:true}
      ttl-minutes: ${RIDE_EXPIRATION_TTL_MINUTES:15}
      scan-interval-ms: ${RIDE_EXPIRATION_SCAN_INTERVAL_MS:60000}

logging:
  level:
    root: INFO
    com.unimove: INFO
