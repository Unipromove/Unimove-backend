# Perfil de producao (SPRING_PROFILES_ACTIVE=prod).
#
# Alvo atual: VPS Hetzner (4 GB) com Postgres local na mesma stack do compose.
# Ver docs/deploy-vps.md.
#
# --- Por que redeclarar JWT_SECRET e DATABASE_PASSWORD ---
# O application.yml define defaults de desenvolvimento para os dois:
#
#   JWT_SECRET        -> "dev-secret-NAO-USE-EM-PRODUCAO-..."  (48 chars: chave HMAC VALIDA!)
#   DATABASE_PASSWORD -> "changeme"
#
# Sem as redeclaracoes abaixo, esquecer a env var nao quebraria nada: a API
# subiria feliz assinando JWT com um segredo que esta neste repositorio.
# O Binder do Spring Boot nao explode em placeholder nao resolvido — ele passa
# o texto literal "${JWT_SECRET}" adiante. O startup aborta mesmo assim (o JJWT
# rejeita os 13 bytes como chave HMAC fraca; o Postgres recusa a senha literal),
# so que com erro menos obvio. O que importa e que aborta em vez de usar o
# segredo de desenvolvimento.
spring:
  datasource:
    password: ${DATABASE_PASSWORD}
    hikari:
      # Postgres local na mesma stack (max_connections=100).
      # 10 e o default do Hikari e sobra para o piloto; ajuste por env var.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
  # SSE (mural, chat, status da corrida) segura conexoes abertas por minutos.
  # O shutdown gracioso deixa as requisicoes em voo terminarem e corta os
  # streams no timeout, em vez de derrubar tudo no SIGTERM do deploy.
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        # So a doc (Swagger) usa sessao; o TLS termina no Caddy, entao o
        # Tomcat nao saberia sozinho que o cookie trafega em HTTPS.
        secure: true
        same-site: strict
  tomcat:
    threads:
      # O default de 200 threads nao faz sentido no piloto e custa memoria.
      # Os endpoints SSE usam processamento assincrono e devolvem a thread do
      # container, entao nao ocupam uma vaga enquanto o stream fica aberto.
      max: 50

app:
  jwt:
    secret: ${JWT_SECRET}
