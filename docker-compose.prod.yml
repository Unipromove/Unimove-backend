# Producao: API + Postgres + TLS numa VPS (Hetzner, 4 GB). Ver docs/deploy-vps.md.
#
# A imagem nao e compilada aqui: vem pronta do GHCR. O CI sincroniza este
# arquivo, o Caddyfile e scripts/ para /opt/unimove e roda scripts/deploy.sh.
# Os segredos vivem so no /opt/unimove/.env (chmod 600), criado a mao na VPS.
#
# Uso manual: docker compose -f docker-compose.prod.yml up -d

# Sem limite, o json-file cresce sem parar e enche o disco de uma VPS que
# ninguem visita. 30 MB por servico ja da historico de sobra pra depurar.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Mesma major do Supabase de onde os dados vieram: dump de uma versao mais
    # nova nao restaura numa mais velha. Subir de major = dump/restore, nunca
    # so trocar a tag (o formato do diretorio de dados muda).
    image: postgres:17-alpine
    container_name: unimove-postgres-prod
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: unimove
      POSTGRES_USER: unimove
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD no .env}
    volumes:
      - unimove_pgdata_prod:/var/lib/postgresql/data
    # Loopback apenas — o banco nunca fica exposto na internet.
    # Para inspecionar de fora: ssh -L 5432:127.0.0.1:5432 <vps>
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unimove -d unimove"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/cristianneves/unimove:${IMAGE_TAG:-latest}
    container_name: unimove-api-prod
    restart: always
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    # Com o MaxRAMPercentage=50 do Dockerfile, heap de ~768 MB. O resto dos
    # 4 GB fica para o Postgres, o Caddy e o page cache do SO.
    mem_limit: 1536m
    # Todas as variaveis do app (WhatsApp, Google, Supabase Storage, LGPD...)
    # vem do .env: uma variavel nova nao precisa ser repetida aqui. As de baixo
    # sobrescrevem o .env porque so fazem sentido dentro desta stack.
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/unimove
      DATABASE_USER: unimove
      # Sem estes o boot falha de qualquer jeito; o :? so falha antes, com
      # mensagem clara, em vez de um stacktrace do Spring.
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (copie o do ambiente anterior)}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?defina DATA_ENCRYPTION_KEY no .env (copie o do ambiente anterior)}
    # Loopback: quem publica na internet e o Caddy. O deploy.sh usa esta porta
    # para o health check local.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # A imagem e alpine: wget vem do busybox, curl nao existe.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: unimove-caddy-prod
    restart: always
    logging: *default-logging
    depends_on:
      - api
    environment:
      # Trocar DuckDNS por dominio proprio = mudar esta linha no .env.
      DOMAIN: "${DOMAIN:?defina DOMAIN no .env, ex unimove.duckdns.org}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistem os certificados Let's Encrypt. Sem isso, cada deploy pediria
      # um certificado novo e bateria no rate limit da LE (5/semana por dominio).
      - caddy_data:/data
      - caddy_config:/config

volumes:
  unimove_pgdata_prod:
  caddy_data:
  caddy_config:
