# Blueprint do Render — cria o web service a partir da imagem publicada no GHCR
# pelo .github/workflows/deploy.yml. O Render NAO compila nada: os testes ja
# rodaram no CI e a imagem chega pronta.
#
# Uso: Render Dashboard -> New -> Blueprint -> aponte para este repositorio.
# Ver docs/deploy.md para o passo a passo (credencial do GHCR, Supabase, secrets).

services:
  - type: web
    name: unimove-api
    runtime: image
    plan: free
    # Entre as regioes do Render, virginia e a de menor latencia para o Brasil.
    # O Supabase deve ficar na MESMA regiao (us-east-1): cada request faz varias
    # idas ao banco, entao a distancia ate ele pesa mais que a do usuario ate aqui.
    region: virginia
    image:
      url: ghcr.io/cristianneves/unimove:latest
      # Referencia a credencial cadastrada em Workspace Settings -> Registry
      # Credentials (PAT do GitHub com escopo read:packages). O pacote e privado.
      # Aqui vai so o NOME: o segredo nunca entra neste arquivo.
      creds:
        fromRegistryCreds:
          name: ghcr-unimove
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # --- Postgres (Supabase, pooler em session mode) ---
      # sync: false = o Render pergunta o valor na criacao e guarda cifrado;
      # o valor nunca fica neste arquivo nem no git.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # O Render gera um valor base64 de 256 bits na criacao — exatamente o
      # minimo que o JJWT exige (ele rejeita chave HMAC menor que isso).
      # Assim a chave de assinatura nasce dentro do Render e nunca passa por
      # terminal, clipboard ou log. So e gerada se ainda nao existir, entao um
      # sync do Blueprint nao rotaciona o segredo nem invalida os tokens em uso.
      - key: JWT_SECRET
        generateValue: true

      # --- Verificacao de telefone ---
      # Comece em LOG. Trocar para WHATSAPP com as tres credenciais vazias
      # derruba o startup de proposito. Ver docs/verificacao-telefone.md.
      #
      # sync: false, nao `value: LOG`. Com `value:` a variavel fica gerenciada
      # pelo Blueprint e TODO sync reescreve o valor — a producao ja voltou
      # sozinha para LOG depois de ligada no WHATSAPP, e o app passou a servir
      # o numero de exemplo do LogOnlyChannel (wa.me/5500000000000) como se
      # fosse o numero real. Sem `value`, o Render nao mexe: o canal vive no
      # dashboard, junto das tres credenciais que ele ja precisa.
      # Ausente => LOG, pelo default de application.yml.
      - key: PHONE_VERIFICATION_CHANNEL
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false

      # --- Login social ---
      # Mesmo motivo do PHONE_VERIFICATION_CHANNEL: e um liga/desliga operado
      # pelo dashboard, junto do GOOGLE_CLIENT_IDS. Com `value: "false"` o
      # primeiro sync do Blueprint desligaria o login social sem aviso e
      # /auth/social voltaria a responder 503.
      # Ausente => false, pelo default de application.yml.
      - key: GOOGLE_LOGIN_ENABLED
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false

      # --- Documentos do motorista (Supabase Storage, bucket privado) ---
      # Sem os dois, o upload responde 503 — o resto da API segue normal.
      # service_role so no backend; ver docs/homologacao-runbook.md.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # --- Criptografia de CPF/CNH (obrigatoria em prod: sem ela o boot falha) ---
      # Gere com `openssl rand -base64 32` e guarde uma copia fora do Render:
      # perder a chave torna os dados ilegiveis.
      - key: DATA_ENCRYPTION_KEY
        sync: false

      # --- Privacidade (LGPD) ---
      # sync: false pelo mesmo motivo do canal do WhatsApp: trocar a versao
      # dos termos obriga novo aceite no cadastro; e decisao de produto, operada
      # no dashboard, nao algo que o Blueprint deva resetar.
      - key: PRIVACY_TERMS_VERSION
        sync: false
      - key: PRIVACY_POLICY_URL
        sync: false

      # --- Mapas ---
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: PHOTON_BASE_URL
        value: https://photon.komoot.io
